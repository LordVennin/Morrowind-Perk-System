MainSettings: "Main"
SettingMainMenuKey: "Hotkey"
SettingMainMenuKeyDescription: |
  Key combination to open the map menu. Can contain multiple keys (e.g. Ctrl+M+N+...).
  To set, click the field showing the current key combination, then press the desired keys.
  To reset, right-click the field, or press the gamepad 'B' button while assigning.
SettingDiscoveryRadius: "Discovery Radius"
SettingDiscoveryRadiusDescription: "The radius (in game units) around the player within which locations will be automatically discovered on the map."
SettingUpdateFrequency: "Update Frequency"
SettingUpdateFrequencyDescription: "How often (in times per second) the map updates when in non menu mode."
# SettingFastClose: "Fast close"
# SettingFastCloseDescription: "When enabled, the map will close immediately when the hotkey is pressed while the map is open. If disabled, pressing the hotkey while the map is open and interactive will only exit the interactive mode first, before closing the map on the next press."
SettingOverrideDefaultMap: "Override default map"
SettingOverrideDefaultMapDescription: "When enabled, the Advanced World Map will replace the default Morrowind map menu. Requires a save reload to take effect. Important: this option doesn't work correctly with the controller menu! If the standard map does not appear after disabling this option, click on the minimap in the game interface."
SettingSaveVisibilityStateInInterfaceMenu: "Save open/close state in Character menu"
SettingSaveVisibilityStateInInterfaceMenuDescription: "When override default map is enabled, saves whether the map was last opened from the Character menu or not, and restores that state the next time the Character menu is opened."
SettingFirstInitMenu: "Show first-time setup menu"
SettingFirstInitMenuDescription: "When enabled, the first-time setup menu will be shown the next time the mod menu is opened."
SettingResetSizePos: "Reset size and position"
SettingResetSizePosDescription: "Change to 'Yes' to reset the map window size and position to default values. The setting will automatically revert to 'No' after the reset is done."

DataSettings: "Data"
SettingDataInitializer: "World map texture initializer"
SettingDataInitializerDescription: |
  Source of the world map texture. If a texture for the chosen source is not found, "Auto" will be used.
  "Auto" - selected automatically.
  "Your custom" - a user-generated custom texture.
  "Quest Guider's Quest Data" - from the quest data of the Quest Guider Lite mod.
  "Tamriel Rebuilt+" - built-in texture for TR + Project Cyrodiil + Skyrim: Home of the Nords.
  "Base game" - built-in texture for the original Morrowind + Bloodmoon.
  "None" - no texture (map cells will be filled with a solid color).

TilesetSettings: "Local map tiles"
TilesetSettingsDescription: "Configure local tilesets of world map."
SettingTilesetOnlyDiscovered: "Show only discovered tiles"
SettingTilesetOnlyDiscoveredDescription: "When enabled, only tiles for cells that have been discovered by the player will be shown on the local part of the world map."
SettingTilesetZoomToShow: "Zoom to show tiles"
SettingTilesetZoomToShowDescription: "The zoom level at which local tiles will start to be shown on the world map."

LegendSettings: "Legend"
LegendSettingsDescription: "Configure the legend displayed on the map."
SettingLegendOnlyDiscovered: "Show only discovered markers"
SettingLegendZoomToGroup: "Zoom to group markers"
SettingLegendZoomToGroupDescription: "The zoom level below which nearby markers are grouped together."
SettingLegendOnlyDiscoveredDescription: "When enabled, only entrance markers and city markers that have been discovered by the player will be shown on the map."
SettingLegendVisitedCellsOnWorldMap: "Show visited cells on world map"
SettingLegendVisitedCellsOnWorldMapDescription: "When enabled, cells that have been visited by the player will be shown like local map tiles on the world map. Important: may highly impact performance."
SettingLegendMarkerSize: "Marker size"
SettingLegendMarkerSizeDescription: "The size of the markers displayed on the map."
SettingLegendRegionAlpha: "Region name alpha"
SettingLegendRegionAlphaDescription: "The transparency level of region names on the map. In percentage (0-100)."
SettingLegendCityAlpha: "City marker alpha"
SettingLegendCityAlphaDescription: "The transparency level of city markers on the map. In percentage (0-100)."
SettingLegendEntranceAlpha: "Entrance marker alpha"
SettingLegendEntranceAlphaDescription: "The transparency level of entrance markers on the map. In percentage (0-100)."

NotesSettings: "Notes"
SettingNotesMapFontSize: "Marker/font size"
SettingNotesMapFontSizeDescription: "The size of the note markers on the map."

FastTravelSettings: "Fast Travel"
SettingFastTravelEnabled: "Enable fast travel"
SettingFastTravelEnabledDescription: "When enabled, allows fast travel to the entrance nearest to the selected point on the map."
SettingFastTravelOnlyDiscovered: "Fast travel to discovered locations only"
SettingFastTravelOnlyDiscoveredDescription: "When enabled, fast travel will only be possible to locations that have been discovered by the player."
SettingFastTravelOnlyReachable: "Fast travel to reachable locations only"
SettingFastTravelOnlyReachableDescription: "When enabled, fast travel will only be possible to locations that have a reachable path from the player's current position."
SettingFastTravelWithFollowers: "With followers"
SettingFastTravelWithFollowersDescription: "When enabled, followers will travel with you when you fast travel."
SettingFastTravelAllowToInterior: "Allow fast travel to interiors"
SettingFastTravelAllowToInteriorDescription: "When enabled, allows fast travel to interior locations."
SettingFastTravelCooldown: "Fast travel cooldown"
SettingFastTravelCooldownDescription: "The cooldown time between consecutive fast travels, measured in in-game hours or as this value multiplied by 2 real-time minutes. Set to 0 to disable."
SettingFastTravelBaseMagickaCost: "Base magicka cost"
SettingFastTravelBaseMagickaCostDescription: "The base magicka cost for fast traveling."
SettingFastTravelAdditionalCost: "Magicka cost per unit distance"
SettingFastTravelAdditionalCostDescription: "The additional magicka cost per unit distance traveled when fast traveling."

InputSettings: "Input"
SettingInputGamepadControls: "Improved gamepad controls"
SettingInputGamepadControlsDescription: "When enabled, allows using gamepad to pan and zoom the map. Right analog stick to pan, right and left triggers to zoom in and out."
SettingInputGamepadControlsBumperMode: "Gamepad bumper mode"
SettingInputGamepadControlsBumperModeDescription: "Remaps gamepad controls to use right and left bumper buttons for zooming instead of triggers."
SettingInputContextMenuKey: "Context menu key"
SettingInputContextMenuKeyDescription: "The key used to open the context menu on the map."
SettingInputToggleMapTypeKey: "Toggle local/world map key"
SettingInputToggleMapTypeKeyDescription: "The key used to toggle between local and world map views."
SettingInputTogglePinKey: "Toggle pin map key"
SettingInputTogglePinKeyDescription: "The key used to toggle pinning the map window."

