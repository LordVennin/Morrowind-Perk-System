SettingUIDefaultLightColor: "Marker light color"
SettingUIDefaultLightColorDescription: "The color used for markers indicating locations that have been visited on the map."
SettingUIWhiteColor: "White color"
SettingUIWhiteColorDescription: "The white color for some selected UI elements."
