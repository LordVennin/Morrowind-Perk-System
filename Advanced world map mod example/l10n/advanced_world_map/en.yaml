SettingUIFoundMarkerColorDescription: "The color used to highlight found by search markers on the map."
SettingUIFoundMarkerLightColor: "Search marker alternative color"
SettingUIFoundMarkerLightColorDescription: "The alternative color used on search markers on the map."
SettingUITextShadowColor: "Text shadow color"
SettingUITextShadowColorDescription: "The color of the shadow behind some UI text elements."
SettingUIDefaultTextureColor: "Default texture color"
SettingUIDefaultTextureColorDescription: "Color for filling maps with missing textures."