SettingUIResizerSizeDescription: "The size of the resizer handle at the bottom-right corner of the map window."
SettingUIScrollBarSize: "Scroll bar width"
SettingUIScrollBarSizeDescription: "The width of the scroll bar at the right edge of a scroll box."
SettingUIMouseScrollAmount: "Mouse scroll amount"
SettingUIMouseScrollAmountDescription: "The amount scrolled when using the mouse wheel within a scroll box."
