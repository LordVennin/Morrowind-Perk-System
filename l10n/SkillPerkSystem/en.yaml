name: "Skill Perk System"
modSettingsDescription: "Configure perk keybind and point progression rewards."

gameplay: "Gameplay"

toggleUiKeyName: "Perk Menu Key"
toggleUiKeyDescription: "Single letter key used to open the perk menu."

enableLevelUpRewardsName: "Enable Level Rewards"
enableLevelUpRewardsDescription: "Enable perk points gained from character level-ups."

pointsPerLevelName: "Points Per Level"
pointsPerLevelDescription: "How many perk points are awarded on each level up."

enableSkillMilestone1Name: "Enable Threshold #1"
enableSkillMilestone1Description: "Enable perk points from the first skill threshold."

skillMilestone1Name: "Skill Threshold #1"
skillMilestone1Description: "First skill level threshold that grants one perk point."

enableSkillMilestone2Name: "Enable Threshold #2"
enableSkillMilestone2Description: "Enable perk points from the second skill threshold."

skillMilestone2Name: "Skill Threshold #2"
skillMilestone2Description: "Second skill level threshold that grants one perk point."

enableSkillMilestone3Name: "Enable Threshold #3"
enableSkillMilestone3Description: "Enable perk points from the third skill threshold."

skillMilestone3Name: "Skill Threshold #3"
skillMilestone3Description: "Third skill level threshold that grants one perk point."
perks: "Perks"

basePackHud: "Overheal Bar (Restoration)"
overhealBarXName: "Bar position: left / right"
overhealBarXDescription: "How far from the left edge of the screen the overheal bar is drawn. Easier: tick 'Move the bar' below and drag it instead."
overhealBarYName: "Bar position: up / down"
overhealBarYDescription: "How far above the bottom edge of the screen the overheal bar is drawn (a negative number moves it up). Easier: tick 'Move the bar' below and drag it instead."
overhealBarScaleName: "Bar length"
overhealBarScaleDescription: "Makes the overheal bar longer or shorter. 1 is the same length as the health bar, 2 is twice as long."
overhealBarUnlockName: "Move the bar"
overhealBarUnlockDescription: "Tick this, open your inventory so the mouse cursor appears, and drag the red bar with the mouse onto your health bar. Untick it once the bar is where you want it."

showOnlyClassSkillsName: "Show Only My Class Skills"
showOnlyClassSkillsDescription: "Show perk trees only for your class's major and minor skills. Untick to see every skill's tree."
